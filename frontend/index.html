<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skin Cancer Screening</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    text-align: center;
    padding: 0 20px;
  }
  h1 { font-size: 22px; }
  #preview {
    width: 100%;
    max-width: 300px;
    margin: 20px auto;
    border-radius: 8px;
    display: none;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    margin: 6px;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 8px;
    display: none;
  }
  .benign { background: #dcfce7; color: #166534; }
  .malignant { background: #fee2e2; color: #991b1b; }
  #disclaimer {
    margin-top: 30px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>

<h1>Skin Lesion Screening</h1>
<p>Upload or take a photo of a skin lesion for an AI-based screening prediction.</p>

<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
<button onclick="document.getElementById('fileInput').click()">Take / Choose Photo</button>
<button id="analyzeBtn" onclick="analyzeImage()" disabled>Analyze</button>

<img id="preview" alt="Selected photo preview">

<div id="result"></div>

<p id="disclaimer">
  This tool is for educational purposes only and is not a substitute for professional medical diagnosis. Consult a dermatologist for any skin concerns.
</p>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const analyzeBtn = document.getElementById('analyzeBtn');
const resultDiv = document.getElementById('result');
let selectedFile = null;

fileInput.addEventListener('change', (e) => {
  selectedFile = e.target.files[0];
  if (selectedFile) {
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = 'block';
    analyzeBtn.disabled = false;
    resultDiv.style.display = 'none';
  }
});

async function analyzeImage() {
  if (!selectedFile) return;

  analyzeBtn.disabled = true;
  analyzeBtn.textContent = 'Analyzing...';
  resultDiv.style.display = 'none';

  const formData = new FormData();
  formData.append('file', selectedFile);

  try {
    const response = await fetch('http://127.0.0.1:8000/predict', {
      method: 'POST',
      body: formData
    });
    const data = await response.json();

    resultDiv.className = data.prediction;
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
      <strong>Prediction: ${data.prediction.toUpperCase()}</strong><br>
      Confidence: ${data.confidence}%
    `;
  } catch (err) {
    resultDiv.style.display = 'block';
    resultDiv.className = '';
    resultDiv.innerHTML = 'Error: could not reach the server. Is the backend running?';
  }

  analyzeBtn.disabled = false;
  analyzeBtn.textContent = 'Analyze';
}
</script>

</body>
</html>
